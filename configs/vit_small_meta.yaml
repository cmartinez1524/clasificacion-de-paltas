# ViT-S/16 + metadatos de almacenamiento (temperatura one-hot y dia escalado).
# Misma receta que vit_small.yaml; la unica diferencia es que la cabeza recibe
# tambien la informacion que usa la referencia sin imagen.
name: vit_small_meta
model: vit_small_meta
pretrained: true

img_size: 224
batch_size: 64
num_workers: 10
use_cache: true
use_class_weights: true

epochs: 15
lr: 0.0001
head_lr_mult: 10.0
weight_decay: 0.05
warmup_epochs: 2.0
label_smoothing: 0.05
drop_path_rate: 0.1
grad_clip: 1.0
amp: true

seed: 42
early_stop_patience: 5

notes: "ViT-S/16 + temperatura y dia de almacenamiento"

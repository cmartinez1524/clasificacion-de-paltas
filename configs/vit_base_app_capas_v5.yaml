name: vit_base_app_capas_v5
model: vit_base
pretrained: true
layer_decay: 0.75
img_size: 224
batch_size: 32
num_workers: 4
use_cache: true
use_class_weights: true
epochs: 20
lr: 0.00005
head_lr_mult: 10.0
weight_decay: 0.05
warmup_epochs: 2.0
label_smoothing: 0.05
drop_path_rate: 0.1
grad_clip: 1.0
amp: true
seed: 42
early_stop_patience: 6
primary_metric: qwk
notes: "Misma receta DeiT-B v3 desde ImageNet; unico ajuste: LR por capas, factor 0.75. Ultimo bloque y norm LR base; cabeza LR x10. Sin fotos nuevas."
